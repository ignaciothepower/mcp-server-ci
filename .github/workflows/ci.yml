# WORKFLOW: se dispara solo en cada push y en cada pull request a main
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # JOB 1: control de calidad. Cada job corre en una maquina limpia de GitHub (Ubuntu)
  calidad:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]   # el mismo job, dos veces: con dos versiones de Python
    steps:
      # STEP: bajar el codigo del repositorio a la maquina
      - uses: actions/checkout@v7

      # STEP: instalar Python y guardar en cache lo que descarga pip (la 2a vez va mas rapido)
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Linting (ruff check)
        run: ruff check .

      - name: Formato (ruff format --check)
        run: ruff format --check .

      - name: Tests (pytest)
        run: pytest -v

  # JOB 2: comprobar que los secretos llegan bien. Solo corre si 'calidad' ha pasado (needs)
  secretos:
    needs: calidad
    runs-on: ubuntu-latest
    # Settings > Secrets and variables > Actions
    #   secrets.*  datos SENSIBLES: cifrados y enmascarados (***) en los logs
    #   vars.*     configuracion NO sensible: se ve en claro (una URL publica no es un secreto)
    env:
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Smoke test de LangFuse (con los Secrets)
        run: python scripts/check_langfuse.py
